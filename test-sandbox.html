<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three-Loader Code Sandbox Test</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background: #0f0f0f;
            color: #ffffff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-panel {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .code-editor {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
            color: #e0e0e0;
            width: 100%;
            min-height: 200px;
            resize: vertical;
        }
        .button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 5px 0 0;
            font-size: 14px;
            transition: background 0.2s;
        }
        .button:hover {
            background: #1d4ed8;
        }
        .button.success {
            background: #10b981;
        }
        .button.danger {
            background: #ef4444;
        }
        .result {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .warning { color: #f59e0b; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Three-Loader Code Sandbox Test</h1>
        <p>Test the enhanced Three.js code execution system with safe sandboxing.</p>
        
        <!-- Test 1: Basic Three.js Scene Creation -->
        <div class="test-panel">
            <h3>Test 1: Basic Three.js Scene Creation</h3>
            <textarea class="code-editor" id="test1-code">
// Create a basic Three.js scene
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 800/600, 0.1, 1000);
const geometry = new THREE.BoxGeometry(2, 2, 2);
const material = new THREE.MeshBasicMaterial({ 
    color: 0x00ff00, 
    wireframe: true 
});
const cube = new THREE.Mesh(geometry, material);

scene.add(cube);
camera.position.z = 5;

// Return results for extraction
__results.sceneObjects = [{
    name: 'TestCube',
    type: 'Mesh',
    position: [cube.position.x, cube.position.y, cube.position.z],
    geometry: { type: 'BoxGeometry' },
    material: {
        type: 'MeshBasicMaterial',
        color: material.color.getHex(),
        wireframe: material.wireframe
    }
}];
__results.camera = {
    fov: camera.fov,
    position: [camera.position.x, camera.position.y, camera.position.z]
};
            </textarea>
            <button class="button" onclick="runTest('test1')">Execute Test 1</button>
            <div class="result" id="test1-result"></div>
        </div>
        
        <!-- Test 2: Security Test (Should Fail) -->
        <div class="test-panel">
            <h3>Test 2: Security Test (Should be Blocked)</h3>
            <textarea class="code-editor" id="test2-code">
// This should be blocked by security restrictions
try {
    fetch('https://example.com/api/data');
    eval('console.log("This should not execute")');
    localStorage.setItem('test', 'blocked');
    document.createElement('script');
} catch (error) {
    console.log('Security working:', error.message);
}

__results.securityTest = 'If you see this, security failed!';
            </textarea>
            <button class="button danger" onclick="runTest('test2')">Execute Security Test</button>
            <div class="result" id="test2-result"></div>
        </div>
        
        <!-- Test 3: Performance Test -->
        <div class="test-panel">
            <h3>Test 3: Performance and Memory Test</h3>
            <textarea class="code-editor" id="test3-code">
// Create multiple objects to test performance
const scene = new THREE.Scene();
const objects = [];

for (let i = 0; i < 100; i++) {
    const geometry = new THREE.SphereGeometry(0.5, 8, 6);
    const material = new THREE.MeshBasicMaterial({ 
        color: Math.random() * 0xffffff 
    });
    const sphere = new THREE.Mesh(geometry, material);
    
    sphere.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10
    );
    
    scene.add(sphere);
    objects.push(sphere);
}

__results.objectCount = objects.length;
__results.sceneChildren = scene.children.length;
            </textarea>
            <button class="button" onclick="runTest('test3')">Execute Performance Test</button>
            <div class="result" id="test3-result"></div>
        </div>
        
        <!-- Test Results Summary -->
        <div class="test-panel">
            <h3>📊 Test Summary</h3>
            <div id="summary-result"></div>
        </div>
    </div>

    <script type="module">
        import { CodeSandbox } from '/src/core/CodeSandbox.js';
        
        let sandbox = null;
        const testResults = {
            test1: null,
            test2: null,
            test3: null
        };
        
        // Initialize sandbox
        async function initializeSandbox() {
            try {
                sandbox = new CodeSandbox();
                console.log('🛡️ CodeSandbox initialized');
                updateSummary();
            } catch (error) {
                console.error('❌ Failed to initialize sandbox:', error);
                document.getElementById('summary-result').innerHTML = 
                    `<span class="error">❌ Sandbox initialization failed: ${error.message}</span>`;
            }
        }
        
        // Run individual test
        window.runTest = async function(testId) {
            if (!sandbox) {
                alert('Sandbox not initialized yet. Please wait...');
                return;
            }
            
            const codeElement = document.getElementById(`${testId}-code`);
            const resultElement = document.getElementById(`${testId}-result`);
            const code = codeElement.value;
            
            resultElement.innerHTML = '<span class="info">⏳ Executing code in sandbox...</span>';
            
            try {
                const startTime = Date.now();
                const result = await sandbox.executeCode(code);
                const duration = Date.now() - startTime;
                
                testResults[testId] = result;
                
                if (result.success) {
                    resultElement.innerHTML = `
<span class="success">✅ Execution Successful</span>
<span class="info">⏱️ Duration: ${result.executionTime || duration}ms</span>
<span class="info">🧠 Memory: ${formatBytes(result.memoryUsage || 0)}</span>

📋 Results:
${JSON.stringify(result.result, null, 2)}`;
                } else {
                    resultElement.innerHTML = `
<span class="error">❌ Execution Failed</span>
<span class="error">Error: ${result.error}</span>
<span class="warning">Type: ${result.type || 'unknown'}</span>`;
                }
                
            } catch (error) {
                testResults[testId] = { success: false, error: error.message };
                resultElement.innerHTML = `
<span class="error">❌ Test Exception</span>
<span class="error">Error: ${error.message}</span>`;
            }
            
            updateSummary();
        };
        
        // Update test summary
        function updateSummary() {
            const summaryElement = document.getElementById('summary-result');
            const total = Object.keys(testResults).length;
            const completed = Object.values(testResults).filter(r => r !== null).length;
            const successful = Object.values(testResults).filter(r => r && r.success).length;
            const failed = completed - successful;
            
            const sandboxStatus = sandbox ? sandbox.getStatus() : { isInitialized: false };
            
            summaryElement.innerHTML = `
<div class="info">🛡️ Sandbox Status: ${sandboxStatus.isInitialized ? '✅ Ready' : '❌ Not Ready'}</div>
<div class="info">📊 Tests Completed: ${completed}/${total}</div>
<div class="success">✅ Successful: ${successful}</div>
<div class="error">❌ Failed: ${failed}</div>

<h4>Sandbox Configuration:</h4>
<div class="info">
Max Execution Time: ${sandboxStatus.config?.maxExecutionTime || 'N/A'}ms
Max Memory Usage: ${formatBytes(sandboxStatus.config?.maxMemoryUsage || 0)}
Pending Messages: ${sandboxStatus.pendingMessages || 0}
</div>

<h4>Security Features:</h4>
<div class="info">
• Web Worker isolation ✅
• API restrictions ✅  
• Memory limits ✅
• Execution timeouts ✅
• Three.js library access ✅
</div>`;
        }
        
        // Format bytes
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Initialize on load
        initializeSandbox();
    </script>
</body>
</html>
