<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Generation Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #0f0f0f;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .test-section {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border: 1px solid #333;
        }
        .code-output {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            overflow-x: auto;
            border: 1px solid #444;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .success {
            color: #10b981;
        }
        .error {
            color: #ef4444;
        }
        .info {
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Live Code Generation Test</h1>
            <p>Testing the new CodeTemplateGenerator functionality</p>
        </div>
        
        <div class="test-section">
            <h3>📋 Test Results</h3>
            <div id="test-results"></div>
        </div>
        
        <div class="test-section">
            <h3>🔧 Generated Code Output</h3>
            <button onclick="testEmptyScene()">Test Empty Scene</button>
            <button onclick="testWithMockData()">Test With Mock Data</button>
            <button onclick="testEducationalMode()">Test Educational Mode</button>
            <button onclick="testCompactMode()">Test Compact Mode</button>
            <div class="code-output" id="code-output">Click a test button above to see generated code...</div>
        </div>
    </div>

    <script type="module">
        import { CodeTemplateGenerator } from './src/codegen/CodeTemplateGenerator.js';
        
        // Mock scene and object manager for testing
        const mockScene = {
            exportSceneData: () => ({
                background: 0x0f0f0f,
                camera: {
                    fov: 75,
                    position: [10, 10, 10]
                }
            })
        };
        
        const mockObjectManager = {
            getAllObjects: () => []
        };
        
        const mockObjectManagerWithData = {
            getAllObjects: () => [
                {
                    id: 1,
                    name: 'test_cube',
                    fileName: 'cube.obj',
                    material: {
                        color: '#9dd9d9',
                        wireframe: true,
                        opacity: 0.8,
                        roughness: 0.5,
                        metalness: 0.0
                    },
                    transform: {
                        position: { x: 0, y: 0, z: 0 },
                        rotation: { x: 0, y: 0, z: 0 },
                        scale: { x: 1, y: 1, z: 1 }
                    },
                    animation: {
                        type: 'rotate_y',
                        speed: 0.01
                    },
                    stats: {
                        meshes: 1,
                        vertices: 8,
                        faces: 12
                    }
                },
                {
                    id: 2,
                    name: 'test_sphere',
                    fileName: 'sphere.obj',
                    material: {
                        color: '#c77dcd',
                        wireframe: false,
                        opacity: 1.0,
                        roughness: 0.2,
                        metalness: 0.8
                    },
                    transform: {
                        position: { x: 5, y: 2, z: -3 },
                        rotation: { x: 0.5, y: 1.0, z: 0 },
                        scale: { x: 2, y: 2, z: 2 }
                    },
                    animation: {
                        type: 'none',
                        speed: 0
                    },
                    stats: {
                        meshes: 1,
                        vertices: 482,
                        faces: 960
                    }
                }
            ]
        };
        
        // Initialize generator
        const generator = new CodeTemplateGenerator(mockScene, mockObjectManager);
        const generatorWithData = new CodeTemplateGenerator(mockScene, mockObjectManagerWithData);
        
        // Test functions
        window.testEmptyScene = function() {
            try {
                const code = generator.generateEditableCode();
                displayResult('✅ Empty Scene Test', 'success', 'Generated code for empty scene');
                displayCode(code);
            } catch (error) {
                displayResult('❌ Empty Scene Test', 'error', error.message);
            }
        };
        
        window.testWithMockData = function() {
            try {
                const code = generatorWithData.generateEditableCode();
                displayResult('✅ Mock Data Test', 'success', 'Generated code with 2 mock objects');
                displayCode(code);
            } catch (error) {
                displayResult('❌ Mock Data Test', 'error', error.message);
            }
        };
        
        window.testEducationalMode = function() {
            try {
                const code = generatorWithData.generateEditableCode({
                    includeComments: true,
                    includeImports: true,
                    includeAnimation: true
                });
                displayResult('✅ Educational Mode Test', 'success', 'Generated heavily commented educational code');
                displayCode(code);
            } catch (error) {
                displayResult('❌ Educational Mode Test', 'error', error.message);
            }
        };
        
        window.testCompactMode = function() {
            try {
                const code = generatorWithData.generateEditableCode({
                    includeComments: false,
                    includeImports: true,
                    includeAnimation: false
                });
                displayResult('✅ Compact Mode Test', 'success', 'Generated compact code without comments');
                displayCode(code);
            } catch (error) {
                displayResult('❌ Compact Mode Test', 'error', error.message);
            }
        };
        
        function displayResult(title, type, message) {
            const resultsDiv = document.getElementById('test-results');
            const resultElement = document.createElement('div');
            resultElement.className = type;
            resultElement.innerHTML = `<strong>${title}:</strong> ${message}`;
            resultsDiv.appendChild(resultElement);
        }
        
        function displayCode(code) {
            const codeOutput = document.getElementById('code-output');
            codeOutput.textContent = code;
        }
        
        // Run initial tests
        document.addEventListener('DOMContentLoaded', () => {
            displayResult('🎯 CodeTemplateGenerator', 'info', 'Loaded successfully');
            displayResult('📦 Mock Scene', 'info', 'Created with test data');
            displayResult('🚀 Ready to Test', 'success', 'All systems operational');
        });
    </script>
</body>
</html>
